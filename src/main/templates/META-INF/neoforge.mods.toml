modLoader="javafml"

loaderVersion="[2,]"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
iconFile = "icon.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/libtooltips"
displayName="${mod_name}"
authors="${mod_authors}"
description='''A Minecraft library that adds tooltips \nto items through translation keys and (a bit) more!'''

[[mixins]]
config="libtooltips.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
